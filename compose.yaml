services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_HOST_PORT:-1433}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Database: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING in .env}
      Jwt__Issuer: ${JWT_ISSUER:-EnterpriseIdentityService}
      Jwt__Audience: ${JWT_AUDIENCE:-EnterpriseIdentityService.Client}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES:-15}
      AuthenticationSessions__Lifetime: ${AUTHENTICATION_SESSION_LIFETIME:-30.00:00:00}
      PasswordRecovery__TokenLifetime: ${PASSWORD_RECOVERY_TOKEN_LIFETIME:-00:30:00}
      PasswordRecovery__RequestCooldown: ${PASSWORD_RECOVERY_REQUEST_COOLDOWN:-00:01:00}
      PasswordRecovery__PublicBaseUrl: ${PASSWORD_RECOVERY_PUBLIC_BASE_URL:-https://localhost}
      EmailVerification__TokenLifetime: ${EMAIL_VERIFICATION_TOKEN_LIFETIME:-1.00:00:00}
      EmailVerification__ResendCooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:-00:01:00}
      EmailVerification__PublicBaseUrl: ${EMAIL_VERIFICATION_PUBLIC_BASE_URL:-https://localhost}
      Resend__Enabled: ${RESEND_ENABLED:-false}
      Resend__ApiKey: ${RESEND_API_KEY:-your-api-key-here}
      Resend__FromAddress: ${RESEND_FROM_ADDRESS:-onboarding@example.invalid}
      Resend__FromName: ${RESEND_FROM_NAME:-Enterprise Identity Service}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      sql:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  sql-data:
