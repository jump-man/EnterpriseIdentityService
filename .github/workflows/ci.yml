name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  IMAGE_NAME: enterprise-identity-service

jobs:
  validate:
    name: Validate source and deployable artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore EnterpriseIdentityService.sln

      - name: Build solution
        run: dotnet build EnterpriseIdentityService.sln --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test tests/EnterpriseIdentityService.UnitTests/EnterpriseIdentityService.UnitTests.csproj
          --configuration Release --no-restore --no-build
          --logger "console;verbosity=normal"

      - name: Run integration tests
        run: >-
          dotnet test tests/EnterpriseIdentityService.IntegrationTests/EnterpriseIdentityService.IntegrationTests.csproj
          --configuration Release --no-restore --no-build
          --logger "console;verbosity=normal"

      - name: Run architecture tests
        run: >-
          dotnet test tests/EnterpriseIdentityService.ArchitectureTests/EnterpriseIdentityService.ArchitectureTests.csproj
          --configuration Release --no-restore --no-build
          --logger "console;verbosity=normal"

      - name: Fail on known vulnerable NuGet packages
        shell: bash
        run: |
          dotnet package list --project EnterpriseIdentityService.sln \
            --vulnerable --include-transitive --no-restore \
            --format json --output-version 1 > vulnerabilities.json
          python3 - <<'PY'
          import json
          import sys

          with open("vulnerabilities.json", encoding="utf-8-sig") as stream:
              report = json.load(stream)

          findings = []
          for project in report.get("projects", []):
              for framework in project.get("frameworks", []):
                  packages = framework.get("topLevelPackages", []) + framework.get("transitivePackages", [])
                  for package in packages:
                      for vulnerability in package.get("vulnerabilities", []):
                          findings.append((
                              project.get("path", "unknown project"),
                              package.get("id", "unknown package"),
                              package.get("resolvedVersion", "unknown version"),
                              vulnerability.get("severity", "unknown severity"),
                              vulnerability.get("advisoryurl", "unknown advisory")))

          if findings:
              for finding in findings:
                  print(" | ".join(finding), file=sys.stderr)
              sys.exit(f"Known vulnerable NuGet dependencies found: {len(findings)}")

          print("No known vulnerable direct or transitive NuGet packages were reported.")
          PY

      - name: Build Bicep templates
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/workload.bicep --stdout > /dev/null
          jq empty infra/production.parameters.example.json

      - name: Build production image
        run: >-
          docker build
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --tag $IMAGE_NAME:${{ github.sha }}
          .

      - name: Validate runtime image contract
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE_NAME:${GITHUB_SHA}"

          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "app"
          docker image inspect "$image" --format '{{json .Config.ExposedPorts}}' | jq -e 'has("8080/tcp")'
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

          sdk_list="$(docker run --rm --entrypoint dotnet "$image" --list-sdks)"
          test -z "$sdk_list"
          docker run --rm --entrypoint /usr/bin/test "$image" -x /app/migrations/efbundle

          if timeout 30s docker run --rm "$image" > invalid-configuration.log 2>&1; then
            echo "The image unexpectedly started without required configuration." >&2
            exit 1
          fi

          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'ConnectionStrings__Database=Server=127.0.0.1;Database=unavailable;User ID=unused;Password=unused;Encrypt=True;TrustServerCertificate=True;Connect Timeout=1' \
            --env Jwt__Issuer=EnterpriseIdentityService.CI \
            --env Jwt__Audience=EnterpriseIdentityService.CI.Client \
            --env Jwt__SigningKey=ci-only-signing-key-with-at-least-32-characters \
            --env Jwt__ExpirationMinutes=15 \
            --env AuthenticationSessions__Lifetime=30.00:00:00 \
            --env PasswordRecovery__TokenLifetime=00:15:00 \
            --env PasswordRecovery__RequestCooldown=00:01:00 \
            --env PasswordRecovery__PublicBaseUrl=https://identity.example.invalid \
            --env EmailVerification__TokenLifetime=1.00:00:00 \
            --env EmailVerification__ResendCooldown=00:01:00 \
            --env EmailVerification__PublicBaseUrl=https://identity.example.invalid \
            --env Resend__Enabled=false \
            "$image")"
          trap 'docker rm --force "$container_id" > /dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container_id"
          exit 1

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Create SPDX JSON SBOM
        run: mkdir -p artifacts

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
          upload-artifact: false

      - name: Package the validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p artifacts
          docker save --output artifacts/image.tar "$IMAGE_NAME:$GITHUB_SHA"
          (cd artifacts && sha256sum image.tar > image.tar.sha256)
          {
            echo "git_sha=$GITHUB_SHA"
            echo "image_id=$(docker image inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{.Id}}')"
          } > artifacts/image-metadata.txt

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
